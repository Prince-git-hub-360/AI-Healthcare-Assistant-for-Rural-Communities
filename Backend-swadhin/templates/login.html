<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login — Healthcare Platform</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f6f5; display: flex; justify-content: center; padding: 60px 20px; }
  .card { background: #fff; padding: 40px; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); width: 100%; max-width: 380px; }
  h1 { color: #1a7f5a; margin-top: 0; font-size: 24px; }
  label { display: block; margin-top: 14px; font-size: 14px; font-weight: bold; color: #333; }
  input { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
  button { margin-top: 22px; width: 100%; padding: 12px; background: #1a7f5a; color: #fff; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
  button:hover { background: #146245; }
  .msg { margin-top: 16px; font-size: 14px; padding: 10px; border-radius: 6px; display: none; }
  .msg.error { background: #fdecea; color: #b3261e; display: block; }
  .msg.success { background: #e6f4ea; color: #1a7f5a; display: block; }
  .link { margin-top: 18px; font-size: 14px; text-align: center; }
  a { color: #1a7f5a; }
</style>
</head>
<body>
<div class="card">
  <h1>Log in</h1>
  <form id="loginForm">
    <label>Username</label>
    <input type="text" id="username" required>

    <label>Password</label>
    <input type="password" id="password" required>

    <button type="submit">Log In</button>
    <div id="msg" class="msg"></div>
  </form>
  <div class="link">No account? <a href="/register-page/">Register</a></div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.className = 'msg';

  const payload = {
    username: document.getElementById('username').value,
    password: document.getElementById('password').value,
  };

  try {
    const res = await fetch('/api/accounts/login/jwt/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();

    if (res.ok) {
      localStorage.setItem('access_token', data.access);
      localStorage.setItem('refresh_token', data.refresh);
      msg.className = 'msg success';
      msg.textContent = 'Login successful! Redirecting...';
      msg.style.display = 'block';
      setTimeout(() => window.location.href = '/dashboard/', 800);
    } else {
      msg.className = 'msg error';
      msg.textContent = JSON.stringify(data);
      msg.style.display = 'block';
    }
  } catch (err) {
    msg.className = 'msg error';
    msg.textContent = 'Network error: ' + err.message;
    msg.style.display = 'block';
  }
});
</script>
</body>
</html>
